name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Typescribe.slnx
      - name: Build
        run: dotnet build Typescribe.slnx -c Release --no-restore
      - name: Validate lazy project loading
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/Typescribe.LazyLoadSmoke/Typescribe.LazyLoadSmoke.csproj -c Release
      - name: Set up Java for EPUBCheck
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate EPUB smoke book
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/Typescribe.EpubSmoke/Typescribe.EpubSmoke.csproj -c Release -- /tmp/typescribe-smoke.epub
      - name: Validate EPUB with EPUBCheck 5.4.0
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          java -jar /tmp/epubcheck/epubcheck-5.4.0/epubcheck.jar /tmp/typescribe-smoke.epub
